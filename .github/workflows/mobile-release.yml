# Signed store builds, started by hand only. Secrets live in GitHub encrypted secrets, never in the
# repository. Each job stops with a clear message if its secrets are missing.
#
# Android secrets:  TP_UPLOAD_KEYSTORE_B64 (base64 .jks), TP_UPLOAD_STORE_PASSWORD, TP_UPLOAD_KEY_PASSWORD,
#                   TP_GOOGLE_SERVICES_JSON_B64
# iOS secrets:      ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_B64 (App Store Connect API key, App Manager),
#                   TP_GOOGLE_SERVICE_INFO_PLIST_B64
name: mobile-release
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which store build
        type: choice
        options: [android, ios]
        required: true
      version_code:
        description: Build number (Android versionCode / iOS build); must increase every upload
        required: true
permissions:
  contents: read
jobs:
  android:
    if: inputs.platform == 'android'
    runs-on: ubuntu-latest
    environment: mobile-release
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env: { K: '${{ secrets.TP_UPLOAD_KEYSTORE_B64 }}' }
        run: test -n "$K" || { echo "::error::Android signing secrets are not configured"; exit 1; }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Firebase config and upload key (from secrets)
        run: |
          echo "${{ secrets.TP_GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > android/app/google-services.json
          echo "${{ secrets.TP_UPLOAD_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - run: VITE_PUSH_ENABLED=true npm run build && npx cap sync android
      - name: Signed AAB
        working-directory: mobile/android
        env:
          TP_VERSION_CODE: ${{ inputs.version_code }}
          TP_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          TP_UPLOAD_STORE_PASSWORD: ${{ secrets.TP_UPLOAD_STORE_PASSWORD }}
          TP_UPLOAD_KEY_ALIAS: upload
          TP_UPLOAD_KEY_PASSWORD: ${{ secrets.TP_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: theprivate-release-aab, path: mobile/android/app/build/outputs/bundle/release/app-release.aab, retention-days: 30 }

  ios:
    if: inputs.platform == 'ios'
    runs-on: macos-15
    environment: mobile-release
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env: { K: '${{ secrets.ASC_KEY_P8_B64 }}' }
        run: test -n "$K" || { echo "::error::App Store Connect API key is not configured (needs a paid Apple Developer Program membership)"; exit 1; }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: VITE_PUSH_ENABLED=true npm run build && npx cap sync ios
      - name: Firebase config and App Store Connect key (from secrets)
        run: |
          echo "${{ secrets.TP_GOOGLE_SERVICE_INFO_PLIST_B64 }}" | base64 -d > ios/App/App/GoogleService-Info.plist
          mkdir -p "$RUNNER_TEMP/asc" && echo "${{ secrets.ASC_KEY_P8_B64 }}" | base64 -d > "$RUNNER_TEMP/asc/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>3J5MTMY4J8</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
      - name: Archive and upload to TestFlight (App Store Connect API key signing)
        working-directory: mobile/ios/App
        run: |
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/asc/AuthKey.p8 -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" CURRENT_PROJECT_VERSION=${{ inputs.version_code }} $AUTH archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" $AUTH
